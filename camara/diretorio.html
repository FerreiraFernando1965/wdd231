<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Câmara de Comércio de Campinas">
    <meta name="author" content="Fernando Luis Ferreira">
    <title>Câmara de Comércio de Campinas | Página Diretório</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="estilos/estilos.css">
    <link rel="stylesheet" href="diretorio.css">
    <link rel="stylesheet" href="estilos/new.css">
    <script src="diretorio.js" defer></script>
</head>
<body>

    <header>
       <div class="brand">
            <img src="imagens/logocccsf.jpg" alt="Logotipo da Câmara de Comércio de Campinas" class="logo" width="50" height="50" fetchpriority="high">
            <span>Câmara de Comércio de Campinas</span>
        </div>
        <button id="hamburger-menu" aria-label="Abrir Menu">☰</button>
        <nav id="nav-menu">
            <ul>
                
                <li><a href="camara.html">Página inicial</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="associe.html">Associe-se</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Seção Hero Atualizada -->
        <section class="hero">
            <img src="imagens/centrocampinascarlosbassan.webp" alt="Visão panorâmica da cidade de Campinas" class="hero-img" fetchpriority="high">
            <div class="hero-content">
                <h1>Empresas Associadas</h1>
                <p>Conheça as empresas associadas da Câmara de Comércio de Campinas.</p>
            </div>
        </section>

        <!-- Filtros de Categoria -->
        <div class="filtros-container">
            <button class="btn-filtro active" data-categoria="todos">Todos</button>
            <button class="btn-filtro" data-categoria="Alimentos">Alimentos</button>
            <button class="btn-filtro" data-categoria="Educação">Educação</button>
            <button class="btn-filtro" data-categoria="Saneamento básico">Saneamento</button>
            <button class="btn-filtro" data-categoria="Compras">Compras</button>
            <button class="btn-filtro" data-categoria="Materiais de construção">Construção</button>
        </div>

        <!-- Grid para renderização dos cards dinâmicos -->
        <section id="grid-cardapio-dinamico"></section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; <span id="anoatual"></span> 🚀 Fernando Luis Ferreira -Campinas, SP, Brasil 🚀</p>
            <p id="ultimaModificacao" class="last-modified"></p>
        </div>
    </footer>

</body>
</html>
